name: Build Windows portable package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-package.yml'
      - 'tools/build_windows_package.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependency locally
        run: python -m pip install --target .deps -r requirements.txt
      - name: Run engine tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\.deps"
          python -m unittest discover -s tests -v
      - name: Build and validate portable ZIP
        run: python tools/build_windows_package.py
      - name: Publish new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create v4.0.3 dist/RawHostileSelect-Windows.zip --target ${{ github.sha }} --title "RawHostileSelect v4 — Package history" --notes "Windows 10/11 64-bit portable package with message history. Extract the ZIP, open RawHostileSelect and double-click START THE APP.bat. Includes Python, Tcl/Tk and NumPy."
